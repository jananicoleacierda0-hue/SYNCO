function show(id){[].forEach.call(document.querySelectorAll('iframe'),function(f){f.className=f.id===id?'on':''});[].forEach.call(document.querySelectorAll('nav button'),function(b){b.className=b.dataset.f===id?'on':''});try{sessionStorage.setItem('shell-tab',id)}catch(e){}}
document.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(b)show(b.dataset.f)};
var s='f1';try{s=sessionStorage.getItem('shell-tab')||'f1'}catch(e){}show(s);

/* Today's-events banner (reads the SchoolSync calendar) */
(function () {
  var bar = document.getElementById("ev");
  if (!bar) return;
  function td() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function tick() {
    var t = td(),
      ev = [],
      off = "";
    try {
      ev = (JSON.parse(localStorage.getItem("school-hub-v1") || "") || {}).cal || [];
    } catch (e) {}
    ev = ev.filter(function (r) {
      return r.date && r.date <= t && (r.end && r.end >= r.date ? r.end : r.date) >= t;
    });
    try {
      off = sessionStorage.getItem("ev-off") || "";
    } catch (e) {}
    var key = t + ":" + ev.length;
    if (!ev.length || off === key) {
      bar.className = "";
      return;
    }
    bar.textContent = "";
    var b = document.createElement("b"),
      s = document.createElement("span"),
      x = document.createElement("button");
    b.textContent = "\uD83D\uDD14 Today:";
    s.textContent = ev
      .map(function (r) {
        return r.title + (r.type && r.type !== "Activity" ? " (" + r.type + ")" : "");
      })
      .join("  \u2022  ");
    x.textContent = "\u2715";
    x.title = "Dismiss";
    x.onclick = function () {
      try {
        sessionStorage.setItem("ev-off", key);
      } catch (e) {}
      bar.className = "";
    };
    bar.appendChild(b);
    bar.appendChild(s);
    bar.appendChild(x);
    bar.className = "on";
  }
  tick();
  setInterval(tick, 5000);
  window.addEventListener("storage", tick);
})();

</script></body></html>
