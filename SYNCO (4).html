function show(id){[].forEach.call(document.querySelectorAll('iframe'),function(f){f.className=f.id===id?'on':''});[].forEach.call(document.querySelectorAll('nav button'),function(b){b.className=b.dataset.f===id?'on':''});try{sessionStorage.setItem('shell-tab',id)}catch(e){}}
document.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(b)show(b.dataset.f)};
var s='f1';try{s=sessionStorage.getItem('shell-tab')||'f1'}catch(e){}show(s);

/* Today's-events / deadline banner (reads the SchoolSync calendar) */
(function () {
  var bar = document.getElementById("ev");
  if (!bar) return;
  function td(n) {
    var d = new Date();
    d.setDate(d.getDate() + (n || 0));
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function lbl(r) {
    return (r.type === "Deadline" ? "\u26A0 Deadline: " : "") + r.title + (r.type && r.type !== "Activity" && r.type !== "Deadline" ? " (" + r.type + ")" : "");
  }
  function tick() {
    var t = td(0),
      tm = td(1),
      all = [],
      off = "";
    try {
      all = (JSON.parse(localStorage.getItem("school-hub-v1") || "") || {}).cal || [];
    } catch (e) {}
    var today = all.filter(function (r) {
        return r.date && r.date <= t && (r.end && r.end >= r.date ? r.end : r.date) >= t;
      }),
      soon = all.filter(function (r) {
        return r.type === "Deadline" && r.date === tm;
      });
    try {
      off = sessionStorage.getItem("ev-off") || "";
    } catch (e) {}
    var key = t + ":" + today.length + ":" + soon.length;
    if ((!today.length && !soon.length) || off === key) {
      bar.className = "";
      return;
    }
    var txt =
      (today.length ? "\uD83D\uDD14 Today: " + today.map(lbl).join("  \u2022  ") : "") +
      (soon.length ? (today.length ? "   |   " : "\u23F0 ") + "Due tomorrow: " + soon.map(function (r) { return r.title; }).join("  \u2022  ") : "");
    bar.textContent = "";
    var s = document.createElement("span");
    s.textContent = txt;
    bar.appendChild(s);
    if (window.Notification && Notification.permission === "default") {
      var en = document.createElement("button");
      en.textContent = "Enable alerts";
      en.style.fontSize = "12px";
      en.onclick = function () {
        Notification.requestPermission().then(tick);
      };
      bar.appendChild(en);
    }
    var x = document.createElement("button");
    x.textContent = "\u2715";
    x.title = "Dismiss";
    x.onclick = function () {
      try {
        sessionStorage.setItem("ev-off", key);
      } catch (e) {}
      bar.className = "";
    };
    bar.appendChild(x);
    bar.className = "on";
    try {
      if (window.Notification && Notification.permission === "granted" && localStorage.getItem("ev-n") !== key) {
        localStorage.setItem("ev-n", key);
        new Notification("SYNCO", { body: txt });
      }
    } catch (e) {}
  }
  tick();
  setInterval(tick, 5000);
  window.addEventListener("storage", tick);
})();

</script></body></html>
